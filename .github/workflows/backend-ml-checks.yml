name: Backend and ML Checks

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'ml/**'
      - 'web/**'
      - '.github/workflows/backend-ml-checks.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn pydantic pandas scikit-learn joblib
      - name: Compile Python source
        run: python -m compileall backend ml
      - name: Import FastAPI application
        working-directory: backend
        run: python -c "from main import app; print(app.title, app.version)"
      - name: Check ML trainer imports
        run: |
          python -c "import runpy; runpy.run_path('ml/train_motion_model.py', run_name='not_main')"
          python -c "import runpy; runpy.run_path('ml/train_occupancy_model.py', run_name='not_main')"
