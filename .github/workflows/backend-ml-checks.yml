name: Backend and ML Checks

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'ml/**'
      - 'web/**'
      - '.github/workflows/backend-ml-checks.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pandas scikit-learn joblib

      - name: Compile Python source
        run: python -m compileall backend ml

      - name: Run backend unit tests
        run: python -m unittest discover -s backend/tests -p 'test_*.py' -v

      - name: Import FastAPI application
        working-directory: backend
        run: python -c "from main import app; print(app.title, app.version)"

      - name: Check ML trainer imports
        run: |
          python -c "import runpy; runpy.run_path('ml/train_motion_model.py', run_name='not_main')"
          python -c "import runpy; runpy.run_path('ml/train_occupancy_model.py', run_name='not_main')"
